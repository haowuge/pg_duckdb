name: Build Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - ".github/workflows/docker.yaml"
  workflow_dispatch:

jobs:
  docker_build:
    name: Build and export Docker image (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        postgres: ["18"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # 👇 关键：只构建单平台（如 linux/amd64），避免 manifest list
      - name: Build image and load to local daemon
        uses: docker/bake-action@v5
        with:
          targets: pg_duckdb_${{ matrix.postgres }}
          push: false
          load: true
          set: |
            *.platform=linux/amd64

      # 👇 手动导出为 tar
      - name: Save image to tar
        run: |
          # 获取镜像名（根据你的 docker-bake.hcl 中 target 的 tags）
          # 假设你的 target 名为 "postgres"，且 tag 是 "latest"
          IMAGE_NAME="postgres:latest"

          # 如果不确定，可以用 docker images 列出
          docker images

          # 保存为 tar
          docker save -o /tmp/pgduckdb-image.tar "$IMAGE_NAME"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgduckdb-postgres-${{ matrix.postgres }}-amd64
          path: /tmp/pgduckdb-image.tar
          retention-days: 7
