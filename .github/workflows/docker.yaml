name: Build Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - docker-bake.hcl
      - ".github/workflows/docker.yaml"
  schedule:
    - cron: "44 4 * * *"
  workflow_dispatch:

jobs:
  docker_build:
    name: Build Docker image for Postgres ${{ matrix.postgres }} on ${{ matrix.runner }}
    strategy:
      matrix:
        postgres: ["18"]
        runner: ["ubuntu-24.04"]

    runs-on: ${{ matrix.runner }}

    env:
      BUILDKIT_PROGRESS: plain
      POSTGRES_VERSION: ${{ matrix.postgres }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Compute branch tag
        id: params
        run: |
          BRANCH=$(echo "${{ github.head_ref || github.ref_name }}" \
              | sed 's/[^a-zA-Z0-9\-\.]/-/g' \
              | cut -c 1-112 | tr '[:upper:]' '[:lower:]' \
              | sed -e 's/-*$//')
          echo "branch_tag=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export image as tar
        uses: docker/bake-action@v5
        with:
          targets: pg_duckdb_${{ matrix.postgres }}
          push: false                      # ← 关键：不推送
          load: true                       # ← 加载到本地 docker daemon（可选）
          outputs: type=docker,dest=/tmp/image.tar  # ← 导出为 tar 文件

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgduckdb-postgres-${{ matrix.postgres }}-image
          path: /tmp/image.tar
          retention-days: 7
